<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YHQ ACADEMY — Kirish</title><style>body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#d9f0ff,#fff);display:grid;place-items:center;min-height:100vh}main{width:min(420px,90vw);background:white;border-radius:24px;box-shadow:0 15px 55px #124e7826;padding:30px}h1{color:#17649a}label{display:block;margin:15px 0}input{display:block;width:100%;box-sizing:border-box;padding:14px;border:1px solid #abc8da;border-radius:11px;margin-top:5px}button{width:100%;background:#16814d;color:white;border:0;border-radius:11px;padding:15px;font-size:17px;font-weight:bold}#error{color:#a33}</style><main><h1>🚦 YHQ ACADEMY V24</h1><p>O‘qituvchi va o‘quvchi uchun yagona kirish</p><form id="f"><label>Login<input name="login" autocomplete="username" required></label><label>Parol<input type="password" name="password" autocomplete="current-password" required></label><button>Kirish</button></form><p id="error"></p></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const x=await r.json();if(!r.ok)throw Error(x.detail||'Xato');location.href=x.role==='teacher'?'/teacher':'/student'}catch(err){document.getElementById('error').textContent=err.message}}</script></html>
